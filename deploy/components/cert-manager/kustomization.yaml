# Optional: let cert-manager obtain and renew the certificate (for example from Let's Encrypt) and store it in the
# `repolens-tls` secret the Ingress already uses. Needs cert-manager installed and a ClusterIssuer named `letsencrypt`
# (see deploy/extras/cluster-issuer-letsencrypt.yaml). Include it from an overlay with `components: [../../components/cert-manager]`.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target: { kind: Ingress, name: repolens }
    patch: |-
      - op: add
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt
