# Applied once per cluster by a cluster administrator (it is cluster-wide, so it is not part of the app).
# Replace the e-mail address. Start with the staging server to avoid Let's Encrypt rate limits, then switch to production.
# Requires cert-manager: https://cert-manager.io/docs/installation/
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    email: you@example.com
    server: https://acme-v02.api.letsencrypt.org/directory        # staging: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef: { name: letsencrypt-account-key }
    solvers:
      - http01:
          ingress: { ingressClassName: nginx }
