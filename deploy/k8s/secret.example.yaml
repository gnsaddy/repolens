# EXAMPLE ONLY — NOT part of kustomization.yaml, so deployments never overwrite your real secret.
# Create the real one once: kubectl apply -f secret.yaml (git-ignored) or use sealed-secrets / external-secrets.
apiVersion: v1
kind: Secret
metadata: { name: repolens-secrets, namespace: repolens }
type: Opaque
stringData:
  REPOLENS_JWT_SECRET: "REPLACE-ME-long-random"
  REPOLENS_SECRET_KEY: "REPLACE-ME-fernet-key"
  REPOLENS_DATABASE_URL: "postgresql+psycopg://repolens:REPLACE-ME@postgres:5432/repolens"
  REPOLENS_LLM_API_KEY: ""
  POSTGRES_PASSWORD: "REPLACE-ME"
