# Single-instance Postgres+pgvector for evaluation. For production prefer a managed Postgres with the
# `vector` extension (RDS, Cloud SQL, Azure Flexible Server) or an operator such as CloudNativePG.
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: repolens }
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 999, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: repolens }
            - { name: POSTGRES_USER, value: repolens }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: repolens-secrets, key: POSTGRES_PASSWORD } }
          readinessProbe: { exec: { command: ["pg_isready", "-U", "repolens", "-d", "repolens"] }, periodSeconds: 5 }
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { memory: 2Gi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 20Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: repolens }
spec:
  clusterIP: None
  selector: { app: postgres }
  ports: [{ port: 5432 }]
