[project]
name = "repolens"
version = "0.2.0b0"
description = "RepoLens AI - repository intelligence and RCA platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi", "uvicorn[standard]", "sqlalchemy>=2", "alembic", "psycopg[binary]", "pgvector", "numpy",
  "pydantic-settings", "pyjwt[crypto]", "bcrypt", "httpx", "langgraph", "anthropic",
  "tree-sitter", "tree-sitter-python", "tree-sitter-javascript", "tree-sitter-typescript",
  "tree-sitter-go", "tree-sitter-java",
  "opentelemetry-api", "opentelemetry-sdk", "opentelemetry-instrumentation-fastapi",
  "opentelemetry-exporter-otlp-proto-http", "prometheus-client", "python-multipart",
  "pypdf>=6.21,<7",  # text of PDF files that have selectable text; pure Python, no OCR
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "ruff", "mypy"]

[tool.setuptools.packages.find]
include = ["repolens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "F811"]  # pytest fixtures are imported and re-declared as arguments
"alembic/*" = ["E501", "I001"]
"repolens/evals/*" = ["E501"]
"repolens/devtools/*" = ["E501"]
"repolens/services/connectors/*" = ["E501"]
"repolens/services/cause_hints.py" = ["E501"]
"repolens/services/outbound.py" = ["E501"]
"repolens/services/retention.py" = ["E501"]
"repolens/services/dashboard.py" = ["E501"]
"repolens/services/mcp_server.py" = ["E501"]
"repolens/services/pr_report.py" = ["E501"]
"repolens/services/fixes.py" = ["E501"]
"repolens/services/chat.py" = ["E501"]
"repolens/agents/workflow.py" = ["E501"]
"repolens/services/routes.py" = ["E501"]
"repolens/services/walkthrough.py" = ["E501"]
"repolens/services/skills.py" = ["E501"]
"repolens/services/golden.py" = ["E501"]
"repolens/api/golden.py" = ["E501"]
"repolens/api/skills.py" = ["E501"]
"repolens/api/chat.py" = ["E501"]
"repolens/services/importers.py" = ["E501"]
"repolens/services/graph_insights.py" = ["E501"]
"repolens/services/calibration.py" = ["E501"]
"repolens/evals/suites/bugs.py" = ["E501"]
"repolens/api/fixes.py" = ["E501"]
"repolens/services/github.py" = ["E501"]
"repolens/devtools/mcp_stdio.py" = ["E501"]
"repolens/api/audit.py" = ["E501"]
"repolens/api/account.py" = ["E501"]
"repolens/api/auth.py" = ["E501"]
"repolens/services/doc_intel.py" = ["E501"]
"repolens/services/proposals.py" = ["E501"]
"repolens/services/bitbucket.py" = ["E501"]
"repolens/api/github.py" = ["E501"]
"repolens/api/bitbucket.py" = ["E501"]
"repolens/services/confluence.py" = ["E501"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = false
