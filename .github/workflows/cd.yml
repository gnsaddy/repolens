name: CD
# Images are published under the app's own version (backend/repolens/__init__.py) and only for a commit whose CI run
# passed: after CI succeeds on a push to main, or when a version tag (or a manual run) is on a commit that already
# passed CI. Until the version number changes, each green commit on main replaces the images of that version; the first one also gets the tag v<version>.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: read   # to look up the CI result of a commit

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  publish:
    # a CI run that failed, or one from a pull request, publishes nothing
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.SHA }}" }
      - name: CI must have passed for this commit
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          PASSED=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$SHA" --status success --json databaseId --jq length)
          [ "${PASSED:-0}" -gt 0 ] || { echo "CI has not passed for $SHA, so nothing is published"; exit 1; }
      - id: meta
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)".*/\1/p' backend/repolens/__init__.py)
          [ -n "$VERSION" ] || { echo "could not read the app version"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "the tag $GITHUB_REF_NAME does not match the app version $VERSION"; exit 1
          fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/repolens-api:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/repolens-web:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release_tag:
    # Once the images of a green commit on main are published, the commit gets the tag v<version> (once: an existing tag is
    # never moved). A tag made with the workflow token does not start another run, so nothing is built twice and nothing is
    # rolled out to a cluster by it; push the tag yourself to deploy.
    needs: publish
    if: ${{ github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Tag the commit with the app version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.tag }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION exists already, so it is left where it is"
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$SHA" >/dev/null
            echo "tagged $SHA as v$VERSION"
          fi

  deploy:
    needs: publish
    # Deploying from CI is opt-in: set the repository variable DEPLOY_MODE=kubectl (and the KUBECONFIG_B64 secret) to have a
    # tag roll out to a cluster. Without it a tag only publishes the images, which is what you want with Argo CD (the cluster
    # pulls from git: tag, wait for the images, change the image tag in your overlay by pull request) or with no cluster at all.
    if: ${{ vars.DEPLOY_MODE == 'kubectl' && github.ref_type == 'tag' }}  # only a tag rolls out, never a green main
    runs-on: ubuntu-latest
    environment: production        # configure required reviewers on this environment for manual approval
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure cluster access
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Deploy
        working-directory: deploy/k8s
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          sed -i "s#ghcr.io/OWNER#ghcr.io/${OWNER}#g" kustomization.yaml api.yaml web.yaml
          kubectl apply -k .   # the Secret is managed out-of-band (see secret.example.yaml)
          kubectl -n repolens set image deploy/api api=ghcr.io/${OWNER}/repolens-api:${{ needs.publish.outputs.tag }}
          kubectl -n repolens set image deploy/web web=ghcr.io/${OWNER}/repolens-web:${{ needs.publish.outputs.tag }}
          kubectl -n repolens rollout status deploy/api --timeout=300s
          kubectl -n repolens rollout status deploy/web --timeout=300s
