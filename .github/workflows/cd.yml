name: CD
# Images are published under the app's own version (backend/repolens/__init__.py), on every push to main and on a
# version tag. Until the version number changes, each push to main replaces the images of that version.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)".*/\1/p' backend/repolens/__init__.py)
          [ -n "$VERSION" ] || { echo "could not read the app version"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "the tag $GITHUB_REF_NAME does not match the app version $VERSION"; exit 1
          fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/repolens-api:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/repolens-web:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    # Deploying from CI is opt-in: set the repository variable DEPLOY_MODE=kubectl (and the KUBECONFIG_B64 secret) to have a
    # tag roll out to a cluster. Without it a tag only publishes the images, which is what you want with Argo CD (the cluster
    # pulls from git: tag, wait for the images, change the image tag in your overlay by pull request) or with no cluster at all.
    if: ${{ vars.DEPLOY_MODE == 'kubectl' && github.ref_type == 'tag' }}  # a push to main never rolls out
    runs-on: ubuntu-latest
    environment: production        # configure required reviewers on this environment for manual approval
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure cluster access
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Deploy
        working-directory: deploy/k8s
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          sed -i "s#ghcr.io/OWNER#ghcr.io/${OWNER}#g" kustomization.yaml api.yaml web.yaml
          kubectl apply -k .   # the Secret is managed out-of-band (see secret.example.yaml)
          kubectl -n repolens set image deploy/api api=ghcr.io/${OWNER}/repolens-api:${{ needs.publish.outputs.tag }}
          kubectl -n repolens set image deploy/web web=ghcr.io/${OWNER}/repolens-web:${{ needs.publish.outputs.tag }}
          kubectl -n repolens rollout status deploy/api --timeout=300s
          kubectl -n repolens rollout status deploy/web --timeout=300s
