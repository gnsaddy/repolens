name: CD
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/repolens-api:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/repolens-web:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    # With Argo CD (GitOps) the cluster pulls from git, so CI needs no cluster access: set the repository variable DEPLOY_MODE=gitops
    # and this job is skipped. Releasing is then: tag, wait for the images, change the image tag in your overlay by pull request.
    if: ${{ vars.DEPLOY_MODE != 'gitops' }}
    runs-on: ubuntu-latest
    environment: production        # configure required reviewers on this environment for manual approval
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Configure cluster access
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
      - name: Deploy
        working-directory: deploy/k8s
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          sed -i "s#ghcr.io/OWNER#ghcr.io/${OWNER}#g" kustomization.yaml api.yaml web.yaml
          kubectl apply -k .   # the Secret is managed out-of-band (see secret.example.yaml)
          kubectl -n repolens set image deploy/api api=ghcr.io/${OWNER}/repolens-api:${{ needs.publish.outputs.tag }}
          kubectl -n repolens set image deploy/web web=ghcr.io/${OWNER}/repolens-web:${{ needs.publish.outputs.tag }}
          kubectl -n repolens rollout status deploy/api --timeout=300s
          kubectl -n repolens rollout status deploy/web --timeout=300s
