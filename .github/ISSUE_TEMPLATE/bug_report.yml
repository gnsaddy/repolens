name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: What happened, description: "What you did, what you expected, what you saw. Do not paste secrets or private code."}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: Version or commit}
  - type: dropdown
    id: how
    attributes: {label: How you run it, options: [Docker Compose, Kubernetes, Local (make dev-api), Other]}
  - type: textarea
    id: logs
    attributes: {label: Relevant log lines, render: text}
